[project]
name = "tunnelsim-models"
version = "0.1.0"
description = "Reference implementations of analytical/empirical tunnelling models (TBM, ground response, settlement)"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tunnelsim_models"]

[tool.pytest.ini_options]
testpaths = ["tests"]
